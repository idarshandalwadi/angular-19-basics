
<div class="m-5">
    <h4 class="mb-2">Enter new value: (It will reflcet effect on all places where it is used - check sender component)</h4>

    <input type="text" #newMessage class="form-control w-25">

    <button (click)="sharedService.updateMessage(newMessage.value)" class="btn btn-primary mt-2">Update Message</button>

    <h5 class="mt-2">Updated Message : {{sharedService.readonlyMsg()}}</h5>
</div>
